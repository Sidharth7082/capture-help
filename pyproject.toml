[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "capture-help"
version = "2.1.0"
description = "A fast, modern, project-aware terminal AI assistant powered by DeepSeek API"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Capture Team", email = "capture@example.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "openai>=1.12.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
capture-help = "capture_help.cli:app"
